<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
    <!--- basic page needs
    ================================================== -->
    <meta charset="utf-8" />
    <title>Monarch Soft Tech LLP</title>
    <meta name="description" content="" />
    <meta name="author" content="" />

    <!-- mobile specific metas
    ================================================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- CSS
    ================================================== -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/vendor.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/service.css" />
    <link rel="stylesheet" href="css/productinquiry.css" />
    <!-- script
    ================================================== -->
    <script src="js/modernizr.js"></script>
    <script defer src="js/fontawesome/all.min.js"></script>

    <!-- favicons
    ================================================== -->

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon.ico" />
    <link rel="manifest" href="site.webmanifest" />
  </head>

  <body id="top">
    <!-- preloader
    ================================================== -->
    <div id="preloader">
      <div id="loader"></div>
    </div>

    <!-- header
    ================================================== -->
    <div id="header"></div>
    <!-- end s-header -->

    <!-- home
    ================================================== -->
    <section
      id="home"
      class="s-home target-section"
      data-parallax="scroll"
      data-image-src="images/indexbg.jpg"
      data-natural-width="3000"
      data-natural-height="2000"
    >
      <div class="s-home__content">
        <div class="s-home__slider">
          <div class="s-home__slide s-home__slide--1">
            <div class="row">
              <div class="column large-12 s-home__slide-text">
                <h2>Better Solutions For Your Business</h2>
                <p>
                  One stop solution to all your wedding video related solutions
                  , virtual systems for news
                </p>
              </div>
            </div>
          </div>
          <!-- end s-home__slide -->
        </div>
        <!-- end s-home__slider -->
      </div>
      <!-- end s-home__content -->

      <div class="s-home__nav-arrows"></div>
      <!-- end s-home__nav-arrows -->

      <div class="s-home__line"></div>
    </section>

    <section class="center-form">
        <form id="dealershipForm" class="inquiry-form">
            <h2>Dealership Inquiry</h2>

            <div class="success" id="successMsg">Form submitted successfully!</div>
            <div class="error" id="errorMsg">Please fill all fields correctly.</div>

            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required />

            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />

            <label for="country">Country</label>
            <select id="country" name="country" required>
                <option value="">Loading countries...</option>
            </select>

            <label for="state">State</label>
            <select id="state" name="state" required>
                <option value="">Select a country first</option>
            </select>

            <label for="city">City</label>
            <input type="text" id="city" name="city" required />

            <label for="phone">Phone Number</label>
            <input type="tel"
                   id="phone"
                   name="phone"
                   required
                   placeholder="123-456-7890" />

            <label for="contactMethod">Choose a Preferred Contact Method *</label>
            <select id="contactMethod" name="contactMethod" required>
                <option value="">Select Method</option>
                <option value="phone_call">Phone Call</option>
                <option value="email">Email</option>
                <option value="whatsapp">WhatsApp</option>
            </select>

            <button type="submit">Submit</button>
        </form>
    </section>

    <div id="footer"></div>
    <!-- end s-home -->
    <script src="js/common.js"></script>
    <script src="js/jquery-3.2.1.min.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>
    <script src="js/index.js"></script>
    <script src="js/dealershipinquiry.js"></script>
  </body>
</html>
